<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <title>Contacte - Geometry Dash</title>
  <link rel="stylesheet" href="estils.css">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
</head>

<body>

<header class="main-header">
  <div class="logo">
   <img src="./img/logo-geometry.jpg" alt="Geometry Dash">
   <h1>Geometry Dash</h1>
  </div>
  <nav>
   <a href="Pagina principal.html">Página principal</a>
   <a href="instruccions.html">Instruccions</a>
   <a href="historia.html">Història</a>
   <a href="contacte.html">Contacte</a>
   <a href="About us.html">About us</a>
  </nav>
</header>

<main class="contacte">

  <h2 class="contacte-title">Contacte</h2>

  <!-- INFO DE CONTACTE -->
  <section class="contacte-info">

    <div class="info-block">
      <h3>Adreça</h3>
      <p>Carrer Bonavista, 70 Cornellà de Llobregat, Barcelona</p>
    </div>

    <div class="info-block">
      <h3>Telèfon</h3>
      <p><a href="34600123456">+34 600 123 456</a></p>
    </div>

    <div class="info-block">
      <h3>Email</h3>
      <p><a href="marcjuandash@gmail.com">marcjuandash@gmail.com</a></p>
    </div>

  </section>

  <!-- MAPA -->
  <section class="mapa">
   <iframe 
      src="https://www.google.com/maps?q=cornelladellobregat&output=embed"
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade">
   </iframe>
  </section>

  <!-- FORMULARI -->
  <section class="formulari">
    <h3>Envia'ns la teva petició</h3>

    <form>

      <label>
        Nom
        <input 
         type="text"
         placeholder="El teu nom"
         required
         pattern="[A-Za-zÀ-ÿ\s]{3,}"
        >
      </label>

      <label>
        Telèfon
        <input 
         type="tel"
         placeholder="600123456"
         required
         pattern="[0-9]{9}"
        >
      </label>

      <label>
        Correu electrònic
        <input 
         type="email"
         placeholder="email@exemple.com"
         required
        >
      </label>

      <label>
        Missatge
        <textarea 
         placeholder="deixa'ns un comentari sobre què et va semblar"
         required minlength="10"></textarea>
      </label>

      <button type="submit">Enviar</button>

    </form>
  </section>

</main>

<footer class="main-footer">
  <div class="social">
   <span class="material-icons">twitter</span>
   <span class="material-icons">instagram</span>
   <span class="material-icons">facebook</span>
   <span class="material-icons">tiktok</span>
  </div>
  <p>© 2026 Geometry Dash</p>
</footer>

</body>
</html>
